name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Syntax
        run: for f in js/*.js sw.js tests/*.js; do node --check "$f"; done
      - name: Data integrity
        run: node tests/check.js
